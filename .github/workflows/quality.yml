name: Quality Net

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy-unit:
    name: policy-unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test policy validator against adversarial fixtures
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  pr-inputs:
    name: pr-inputs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout untrusted PR head without write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The PR HEAD is untrusted. Checkout the validator from the trusted
      # target branch commit instead; the validator inspects the PR worktree.
      - name: Checkout policy implementation from base SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-policy
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PR inputs using trusted base policy, not PR-edited code
        run: python .trusted-policy/scripts/validate_pr_inputs.py --repo . --event "$GITHUB_EVENT_PATH"

  api-contract:
    name: api-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.2'
      - name: Ruby original-source method contracts (fail against known P1 defects)
        run: |
          set -euo pipefail
          ruby api/spec/regression/critical_contract_test.rb | tee /tmp/contract-results.txt
          grep -Eq '^[1-9][0-9]* runs, [1-9][0-9]* assertions' /tmp/contract-results.txt

  api-critical:
    name: api-critical
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rakamin_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d rakamin_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      RAILS_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: rakamin_test
      REDIS_URL: redis://127.0.0.1:6379/1
      SECRET_KEY_BASE: test_only_random_placeholder_not_for_production
      GEMINI_API_KEY: test_only_no_external_requests
      ALLOWED_ORIGINS: http://localhost:5173
      APP_BASE_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.2'
          bundler-cache: true
          working-directory: api
      - name: Prepare isolated schema and run DB-backed requests/services
        working-directory: api
        run: |
          bundle exec rails db:migrate
          bundle exec rspec spec/requests spec/services spec/models --format documentation --fail-if-no-examples

  web-quality:
    name: web-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executable frontend configuration contracts (RED until fixed)
        run: node --test web/tests/*.test.mjs
      - name: Require lockfile for repeatable frontend builds
        run: |
          test -s web/package-lock.json || { echo 'BLOCKED: commit web/package-lock.json generated by npm install on a trusted workstation'; exit 1; }
      - name: Reproducible dependencies, typecheck and build
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Require substantive component suite before release
        run: |
          test -n "$(find web/src -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) -print -quit)" || {
            echo 'BLOCKED: component regression suite is not implemented'; exit 1;
          }

  quality-summary:
    name: quality-summary
    if: always()
    needs: [policy-unit, pr-inputs, api-contract, api-critical, web-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate every mandatory status with no skipped critical jobs
        env:
          EVENT: ${{ github.event_name }}
          POLICY: ${{ needs.policy-unit.result }}
          INPUTS: ${{ needs.pr-inputs.result }}
          CONTRACT: ${{ needs.api-contract.result }}
          API: ${{ needs.api-critical.result }}
          WEB: ${{ needs.web-quality.result }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'Quality results: policy=%s pr-inputs=%s contract=%s api=%s web=%s\n' "$POLICY" "$INPUTS" "$CONTRACT" "$API" "$WEB"
          [[ "$POLICY" == success && "$CONTRACT" == success && "$API" == success && "$WEB" == success ]] || exit 1
          if [[ "$EVENT" == pull_request ]]; then
            [[ "$INPUTS" == success ]] || exit 1
          else
            [[ "$INPUTS" == skipped ]] || exit 1
          fi
          echo 'Quality suite succeeded (release risk approval is a separate gate).'


  release-decision:
    name: release-decision
    # Evaluates the tag even when an upstream job fails/skips. Fail-closed.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [policy-unit, pr-inputs, api-contract, api-critical, web-quality, quality-summary]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify that the workflow is evaluating its triggering version tag
        id: tag-binding
        shell: bash
        run: |
          set -euo pipefail
          TAG_COMMIT=$(git rev-parse "${GITHUB_REF}^{commit}" 2>/dev/null || true)
          if [[ "$GITHUB_REF" == refs/tags/v* && -n "$TAG_COMMIT" && "$TAG_COMMIT" == "$GITHUB_SHA" ]]; then
            echo 'match=verified' >> "$GITHUB_OUTPUT"
            echo "Tagged commit verified: $GITHUB_REF -> $TAG_COMMIT"
          else
            echo 'match=unverified' >> "$GITHUB_OUTPUT"
            echo '::error::Release tag does not resolve to this exact workflow commit'
          fi
      - name: Evaluate mandatory jobs and recorded release risks
        # Do not use continue-on-error. A blocked verdict must FAIL the job.
        env:
          RELEASE_TAG_BINDING: ${{ steps.tag-binding.outputs.match }}
          RELEASE_JOB_POLICY_UNIT: ${{ needs.policy-unit.result }}
          RELEASE_JOB_PR_INPUTS: ${{ needs.pr-inputs.result }}
          RELEASE_JOB_API_CONTRACT: ${{ needs.api-contract.result }}
          RELEASE_JOB_API_CRITICAL: ${{ needs.api-critical.result }}
          RELEASE_JOB_WEB_QUALITY: ${{ needs.web-quality.result }}
          RELEASE_JOB_QUALITY_SUMMARY: ${{ needs.quality-summary.result }}
        run: |
          python scripts/release_gate.py --repo . --ref "$GITHUB_REF" --sha "$GITHUB_SHA" --output release-verdict.json
      - name: Upload evidence even when release is blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verdict-${{ github.run_id }}
          path: release-verdict.json
          if-no-files-found: warn
          retention-days: 30
